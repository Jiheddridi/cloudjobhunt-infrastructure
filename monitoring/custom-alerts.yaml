apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-pod-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-prometheus
    role: alert-rules
spec:
  groups:
  - name: custom-pod-alerts
    interval: 30s
    rules:
    
    # Alerte CPU élevé
    - alert: PodCPUUsageHigh
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace!="monitoring", pod!="", container!=""}[5m])) by (pod, namespace) * 100 > 50
      for: 5m
      labels:
        severity: warning
        team: devops
      annotations:
        summary: "CPU élevé sur pod {{ $labels.pod }}"
        description: "Le pod {{ $labels.pod }} dans le namespace {{ $labels.namespace }} utilise {{ $value | humanize }}% de CPU depuis 5 minutes."
    
    # Alerte RAM élevée
    - alert: PodMemoryUsageHigh
      expr: |
        sum(container_memory_working_set_bytes{namespace!="monitoring", pod!="", container!=""}) by (pod, namespace) 
        / 
        sum(container_spec_memory_limit_bytes{namespace!="monitoring", pod!="", container!=""} > 0) by (pod, namespace) 
        * 100 > 90
      for: 5m
      labels:
        severity: warning
        team: devops
      annotations:
        summary: "Mémoire élevée sur pod {{ $labels.pod }}"
        description: "Le pod {{ $labels.pod }} dans {{ $labels.namespace }} utilise {{ $value | humanize }}% de sa limite mémoire."
    
    # Alerte Pod qui redémarre
    - alert: PodRestartingFrequently
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace!="monitoring"}[15m]) > 0
      for: 5m
      labels:
        severity: critical
        team: devops
      annotations:
        summary: "Pod {{ $labels.pod }} redémarre fréquemment"
        description: "Le pod {{ $labels.pod }} dans {{ $labels.namespace }} redémarre de manière anormale."
    
    # Alerte Pod pas Ready
    - alert: PodNotReady
      expr: |
        sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
      for: 10m
      labels:
        severity: critical
        team: devops
      annotations:
        summary: "Pod {{ $labels.pod }} n'est pas Ready"
        description: "Le pod {{ $labels.pod }} dans {{ $labels.namespace }} n'est pas en état Running depuis 10 minutes."
    
    # Alerte Deployment avec replicas insuffisants
    - alert: DeploymentReplicasMismatch
      expr: |
        kube_deployment_spec_replicas != kube_deployment_status_replicas_available
      for: 10m
      labels:
        severity: warning
        team: devops
      annotations:
        summary: "Deployment {{ $labels.deployment }} manque de replicas"
        description: "Le deployment {{ $labels.deployment }} dans {{ $labels.namespace }} n'a pas le bon nombre de replicas disponibles."
