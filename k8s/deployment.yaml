apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: acrcloudhuntdev.azurecr.io/cloudjobhunt-backend:v5
        ports:
        - containerPort: 8000
          name: http
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        
        # Resources
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Environment variables
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: DEBUG
          value: "true"
        - name: DATABASE_HOST
          value: "psql-cloudhunt-dev.postgres.database.azure.com"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "cloudjobhunt"
        - name: DATABASE_USER
          value: "psqladmin"
        - name: DATABASE_PASSWORD
          value: "CloudJobHunt2026!"
        - name: APP_URL
          value: "https://api.cloudjobhunt.tn"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP
