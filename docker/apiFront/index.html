<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudJobHunt - Find Your Dream Job</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 30px; font-size: 2.5em; }
        .search-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .search-form { display: flex; gap: 15px; flex-wrap: wrap; }
        select, input, button { padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; }
        select { flex: 1; min-width: 150px; }
        input { flex: 2; min-width: 200px; }
        button { background: #667eea; color: white; border: none; cursor: pointer; padding: 12px 30px; font-weight: bold; }
        button:hover { background: #5568d3; }
        .jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .job-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .job-card:hover { transform: translateY(-5px); }
        .job-title { color: #667eea; font-size: 1.3em; margin-bottom: 10px; }
        .job-company { color: #666; font-weight: bold; margin-bottom: 5px; }
        .job-location { color: #999; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .job-description { color: #555; margin-bottom: 15px; line-height: 1.6; }
        .job-link { display: inline-block; background: #764ba2; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
        .job-link:hover { background: #5f3a82; }
        .country-badge { background: #667eea; color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; }
        .source-badge { background: #28a745; color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.75em; margin-left: 5px; }
        .loading { text-align: center; color: white; font-size: 1.5em; }
        .stats { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CloudJobHunt -jihed-Demo</h1>
        
        <div class="search-box">
            <div class="search-form">
                <select id="country">
                    <option value="tn">🇹🇳 Tunisie</option>
                    <option value="fr">🇫🇷 France</option>
                    <option value="gb">🇬🇧 United Kingdom</option>
                    <option value="us">🇺🇸 United States</option>
                    <option value="de">🇩🇪 Germany</option>
                    <option value="ca">🇨🇦 Canada</option>
                    <option value="au">🇦🇺 Australia</option>
                    <option value="nl">🇳🇱 Netherlands</option>
                    <option value="ch">🇨🇭 Switzerland</option>
                </select>
                
                <input type="text" id="keyword" placeholder="DevOps, Cloud Engineer, Python Developer..." value="devops">
                
                <select id="source">
                    <option value="all"> Toutes les sources</option>
                    <option value="adzuna">📊 Adzuna uniquement</option>
                    <option value="jsearch">💼 LinkedIn/Indeed uniquement</option>
                </select>
                
                <button onclick="searchJobs()">Rechercher Des Emplois</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>
        
        <div class="loading" id="loading" style="display:none;">Recherche en cours...</div>
        
        <div class="jobs-container" id="jobs"></div>
    </div>

    <script>
        async function searchJobs() {
            const country = document.getElementById('country').value;
            const keyword = document.getElementById('keyword').value;
            const source = document.getElementById('source').value;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('jobs').innerHTML = '';
            document.getElementById('stats').innerHTML = '';
            
            try {
                const response = await fetch(`/search?country=${country}&keyword=${keyword}&source=${source}`);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (data.count > 0) {
                    const sourceName = source === 'all' ? 'toutes sources' : (source === 'adzuna' ? 'Adzuna' : 'LinkedIn/Indeed');
                    document.getElementById('stats').innerHTML = `
                        Trouvé <strong>${data.count}</strong> offres pour <strong>${keyword}</strong> en <strong>${data.country}</strong>
                        <br>Source: <strong>${sourceName}</strong>
                    `;
                    displayJobs(data.jobs);
                } else {
                    document.getElementById('stats').innerHTML = `Aucun emploi trouvé pour "${keyword}" en ${data.country}`;
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert('Erreur: ' + error);
            }
        }

        function displayJobs(jobs) {
            const container = document.getElementById('jobs');
            
            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <div class="job-title">${job.title}</div>
                    <div class="job-company">🏢 ${job.company}</div>
                    <div class="job-location">
                        📍 ${job.location} 
                        <span class="country-badge">${job.country}</span>
                        <span class="source-badge">${job.source}</span>
                    </div>
                    <div class="job-description">${job.description.substring(0, 150)}...</div>
                    <a href="${job.url}" target="_blank" class="job-link">Voir l'offre →</a>
                `;
                container.appendChild(card);
            });
        }

        // Charger les jobs au démarrage
        window.onload = () => searchJobs();
    </script>
</body>
</html>
