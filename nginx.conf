upstream cloudjobhunt_backend {
    # Point vers l'app FastAPI (uvicorn)
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Redirect HTTP to HTTPS for domain (if configured)
server {
    listen 80;
    listen [::]:80;
    server_name cloudjobhunt.42web.io;
    return 301 https://$server_name$request_uri;
}

# Main server - accepts any hostname/IP (important pour Azure + IP publique)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Accept connections from any domain or IP
    server_name _;
    
    client_max_body_size 20M;
    
    # Health check endpoint pour nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy all requests to FastAPI
    location / {
        proxy_pass http://cloudjobhunt_backend;
        proxy_http_version 1.1;
        
        # Headers for WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Important headers for proper forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Don't modify responses
        proxy_redirect off;
        
        # Streaming support
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Connection settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Keep-alive with backend
        proxy_set_header Connection "";
    }

    # Logs
    access_log /var/log/nginx/cloudjobhunt_access.log combined;
    error_log /var/log/nginx/cloudjobhunt_error.log warn;
}
